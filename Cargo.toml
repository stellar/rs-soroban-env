[workspace]
resolver = "2"

members = [
    "soroban-env-host",
    "soroban-env-guest",
    "soroban-env-common",
    "soroban-env-common/tests/no_std",
    "soroban-env-macros",
    "soroban-builtin-sdk-macros",
    "soroban-test-wasms",
    "soroban-synth-wasm",
    "soroban-fuzz-targets",
    "soroban-bench-utils",
    "soroban-simulation",
]

exclude = ["soroban-test-wasms/wasm-workspace"]

[workspace.package]
# NB: When bumping the major version make sure to clean up the
# code guarded by `unstable-*` features to make it enabled
# unconditionally.
version = "29.0.0"
# NB: raised from 1.84 for the `ml-dsa` dependency, which is edition 2024.
rust-version = "1.85.0"

[workspace.dependencies]
soroban-env-common = { version = "=29.0.0", path = "soroban-env-common", default-features = false }
soroban-env-guest = { version = "=29.0.0", path = "soroban-env-guest" }
soroban-env-host = { version = "=29.0.0", path = "soroban-env-host" }
soroban-env-macros = { version = "=29.0.0", path = "soroban-env-macros" }
soroban-builtin-sdk-macros = { version = "=29.0.0", path = "soroban-builtin-sdk-macros" }
# NB: this must match the wasmparser version wasmi is using
wasmparser = "=0.116.1"

[workspace.dependencies.stellar-xdr]
version = "=28.0.0"
git = "https://github.com/stellar/rs-stellar-xdr"
rev = "f1f1c01e4a25cf9342ee392afcab46699ec4a487"
default-features = false
features = ["cap_0087_ml_dsa"]

[workspace.dependencies.wasmi]
package = "soroban-wasmi"
version = "=0.31.1-soroban.20.0.1"
git = "https://github.com/stellar/wasmi"
rev = "0ed3f3dee30dc41ebe21972399e0a73a41944aa0"

# [patch."https://github.com/stellar/rs-stellar-xdr"]
# [patch.crates-io]
# stellar-xdr = { path = "../rs-stellar-xdr" }
# [patch."https://github.com/stellar/wasmi"]
# soroban-wasmi = { path = "../wasmi/crates/wasmi/" }
# soroban-wasmi_core = { path = "../wasmi/crates/core/" }

[profile.release]
lto = true
debug = true
overflow-checks = true

[profile.test-opt]
inherits = "test"
opt-level = 3
debug = false
overflow-checks = true
